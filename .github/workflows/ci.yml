name: CI

on:
  # NO PATH FILTER ON ANY TRIGGER IN THIS FILE.  With `paths-ignore` present, a
  # push whose changed-file set cannot be computed does not run a smaller CI -
  # it runs NOTHING, silently, and reports no check-suite either.  A gate that
  # looks exactly like a gate and never runs is the hazard this file exists to
  # avoid, not one it may carry.
  #
  # Every release cut in this repository is an orphan squash: one root commit
  # with no common ancestor to the previous main.  GitHub cannot diff such a
  # pair - compare answers 404, "no common ancestor" - and a filter it cannot
  # evaluate means no run.  That is what happened on the 2026-09-17 v-tag cut:
  # no CI run and no CI check-suite was created for the release commit, while
  # the other workflows on the same ref fired within seconds and the docs
  # workflow ran on the tag (tag pushes ignore path filters, which is why
  # exactly one of the two ran).
  #
  # The filter was NOT wrong about any of its paths: a two-dot tree diff of that
  # release changes 26 paths, 16 of them outside the ignored list.  It is
  # structurally unsafe against this repository's release process - a filter has
  # to diff the pushed commit against the branch's previous tip, and a release
  # cut shares no ancestor with it, so there is no change set to evaluate.  The
  # list is therefore gone rather than corrected.  Do not reintroduce one, in
  # either direction: an allowlist `paths:` fails the same way on a release AND
  # silently skips a new source directory.
  push:
    branches: [main]
  # Required status checks are reported on pull requests only when the workflow
  # runs on pull_request, and a public repository that only runs on push gives
  # a contributor no signal at all.  Until this trigger was added the workflow
  # had none: the repository's entire Actions history was a single push run
  # (2026-09-17).
  #
  # No path filter here either: a PR touching only ignored paths would report
  # no checks at all, so a required-checks rule over it could never be
  # satisfied - the same stuck-gate shape as the push defect above.
  pull_request:
    branches: [main]
  # The gap-closer for a release that cannot be verified by pushing.  This
  # trigger starts a run against any ref carrying this file - the release
  # commit included - from the Actions UI or `gh workflow run ci.yml --ref
  # <ref>`, with no push event involved.  Before it existed neither route was
  # available: the file had no dispatch trigger to start a run, and a release
  # push had produced no run to re-run.
  workflow_dispatch:

# Cancel a still-running older run when a newer push lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Coverage policy -------------------------------------------------------
#
# excgrid is a PUBLIC repository, so GitHub gives it unlimited free
# standard-runner minutes AND double the machine: the same label is 4 vCPU /
# 16 GB here against 2 vCPU / 8 GB on a private repo.  That reverses the
# decision that shaped this file's earlier form: the two-leg matrix - and an
# earlier change that removed the test steps outright - existed to spend a
# 2000-minute private-repository budget carefully.  Cost is not the constraint
# any more; verification breadth is.
#
# STANDARD HOSTED LABELS ONLY (windows-latest, windows-11-arm, ubuntu-latest,
# ubuntu-24.04-arm, macos-latest, macos-15-intel).  Larger runners are billed
# and would break the free assumption - never add one here.
#
# What this library's risk actually is.  excgrid has no SIMD tier, no threads
# and no CUDA: it is scalar double-precision kernel code plus grid
# construction.  Its two real hazards are to agree with Libxc on each
# architecture's libm, and for the committed generated kernels to drift from
# their .ey sources - so this matrix buys ARCHITECTURE, COMPILER and SANITIZER
# breadth, and the two checks that carry absolute truth (the pyscf oracle and
# the codegen freshness gate) stay exactly where they can run:
#
#   windows-latest    MSVC       Debug + Release  (the verified toolchain)
#   windows-11-arm    MSVC       Release          (arm64)
#   ubuntu-latest     GCC        Debug + Release  (the verified toolchain)
#   ubuntu-latest     Clang      Debug + Release  (LLVM 21; the -ffp-contract class)
#   ubuntu-latest     ASan+UBSan Release          (highest value per minute here)
#   ubuntu-24.04-arm  GCC        Release          (arm64: a different libm)
#   macos-latest      AppleClang Release          (arm64)
#   macos-15-intel    AppleClang Release          (x64)
#   windows-latest    codegen freshness           (the vendored Yacas is win64)
#   ubuntu-latest     zero-warning Doxygen gate   (blocking, on every change)
#
# FULL SUITE ON EVERY LEG, Debug and Release alike.  A fast Debug subset is a
# decision about MSVC Debug cost and does NOT apply here: 39 tests run in
# 0.27 s on the linux leg, and Debug is the one configuration whose
# iterator/assert checking Release does not repeat.  A build-only Debug leg
# would be a leg that never runs a test.
#
# THE TWO ARM64 LEGS.  excgrid has no x86-specific code, so these are not a
# SIMD-guard probe - that is what an arm leg is for in a project that ships
# vector kernels.  What they add is a second and third
# libm (glibc aarch64, Windows arm64) under the same kernels and a compile of
# every TU for a target nothing else here compiles for.  The linux aarch64 leg
# also CARRIES THE pyscf POINT CHECKS: pyscf 2.14.0 publishes a
# manylinux_2_17_aarch64 wheel (PyPI index, 2026-09-17), so the Libxc oracle
# runs there too.
#
# THE CLANG LEGS GET LLVM 21 FROM apt.llvm.org, not the image's `clang`:
# ubuntu-24.04 ships Clang 18.1.3 (runner image manifest, 2026-09-17) and
# Clang < 19 cannot see std::expected in libstdc++, which
# include/excgrid/error.hpp is built on.
#
# THE pyscf POINT CHECKS ARE THE ORACLE AND MUST BE ABLE TO FAIL.  They were
# red when this file was written (last run before it, 2026-09-16T23:08Z: green
# on windows-msvc-release, failing at exactly this step on linux-gcc-release):
# p86 deviated in three named terms (VWN-RPA baseline against PZ81, C(inf) = aa
# against aa+bb, no zeta-dependent spin factor) and pw91_c deviates in the rs^3
# term of H1's C_c(rs).  The three p86 terms are corrected in xc_defs/ and that
# kernel reproduces the oracle; pw91_c stays a documented NAMED VARIANT with
# both citations, which tools/verify_pyscf.py reports as a variant and not as a
# pass.  DO NOT add continue-on-error, do not skip the step, do not widen the
# tolerance: a job that cannot fail is the same defect as a job that cannot
# run, one level in.
#
# Tool and action versions are pinned: checkout v7.0.1, msvc-dev-cmd v1.13.0,
# setup-python v5 (3.12), Doxygen 1.18.0 (the release the Doxyfile's gate was
# measured against), clang-format 22.1.3 (the freshness gate's formatter - see
# that job), llvm.sh 21.

jobs:
  # -------------------------------------------------------------------------
  # windows-latest, MSVC, Debug + Release.  The original windows-msvc-release
  # leg, unchanged, run for both configurations.
  # -------------------------------------------------------------------------
  windows-msvc:
    name: windows-msvc ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
          - build_type: Debug
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install Doxygen 1.18.0 (pinned release)
        run: |
          Invoke-WebRequest -Uri https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.windows.x64.bin.zip -OutFile doxygen.zip
          Expand-Archive doxygen.zip -DestinationPath doxygen-1.18.0
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\doxygen-1.18.0"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build
      - name: Test (full suite, both configurations)
        run: ctest --test-dir build --output-on-failure
      - name: Docs (zero-warning Doxygen gate)
        run: cmake --build build --target excgrid-docs

  # -------------------------------------------------------------------------
  # ubuntu-latest, GCC and Clang, Debug + Release.  The original
  # linux-gcc-release leg, run for both configurations, plus Clang.
  #
  # `-j 4` because a PUBLIC repository's standard linux runner is 4 vCPU; the
  # `-j 2` in this file's predecessor was sized for the private 2 vCPU one.
  # -------------------------------------------------------------------------
  linux-x86:
    name: linux-x86 ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Release
            cc: gcc
            cxx: g++
            oracle: 1
          - compiler: gcc
            build_type: Debug
            cc: gcc
            cxx: g++
            oracle: 0
          - compiler: clang
            build_type: Release
            cc: clang-21
            cxx: clang++-21
            oracle: 1
          - compiler: clang
            build_type: Debug
            cc: clang-21
            cxx: clang++-21
            oracle: 0
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install LLVM 21 (clang legs only)
        if: matrix.compiler == 'clang'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
      - uses: actions/setup-python@v5
        if: matrix.oracle == 1
        with:
          python-version: '3.12'
      - name: Set up Python deps (pyscf, the Libxc oracle)
        if: matrix.oracle == 1
        run: python3 -m pip install --quiet -r requirements-verif.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure
      # The oracle runs on the RELEASE entries only.  Its subject is a
      # numerical agreement, not a code path, and an -O0 build changes neither
      # the kernels' formulas nor the oracle's; what it would add is a second
      # and third copy of the same red.
      - name: Libxc point checks (pyscf)
        if: matrix.oracle == 1
        run: python3 tools/verify_pyscf.py

  # -------------------------------------------------------------------------
  # ubuntu-latest, AddressSanitizer + UndefinedBehaviorSanitizer.  For code
  # that walks std::span grids, partitions a sphere and indexes padded
  # scratch, this is the highest value per minute on the board: an
  # out-of-bounds read or a signed-overflow in index arithmetic is exactly
  # what the value tests cannot see.
  #
  # No pyscf step here: the sanitized probe would report the oracle's numbers
  # under ASan's runtime, which is a different question from the one the
  # oracle asks.
  # -------------------------------------------------------------------------
  linux-sanitizers:
    name: linux-sanitizers asan+ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j 4
      - name: Test (full suite, under the sanitizers)
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # ubuntu-24.04-arm, GCC.  A second libm under the same kernels, and - with
  # the aarch64 pyscf wheel - a second architecture for the Libxc oracle.
  # -------------------------------------------------------------------------
  linux-arm64:
    name: linux-arm64 gcc Release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Python deps (pyscf, the Libxc oracle)
        run: python3 -m pip install --quiet -r requirements-verif.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure
      - name: Libxc point checks (pyscf)
        run: python3 tools/verify_pyscf.py

  # -------------------------------------------------------------------------
  # windows-11-arm, MSVC arm64.
  #
  # The arch is stated EXPLICITLY rather than inherited: ilammy/msvc-dev-cmd
  # defaults to host=x64, and an arm64 job that inherits that builds an x64
  # binary and runs it under Windows' x64 emulation - a green-looking leg with
  # no arm64 subject at all, which has already happened once in this family of
  # repositories.
  #
  # No pyscf step (no Windows wheels upstream) and no codegen-freshness step
  # (the vendored Yacas is the win64 binary; running it under emulation is not
  # the same experiment).  Doxygen is left to the legs whose job it is.
  # -------------------------------------------------------------------------
  windows-arm64:
    name: windows-arm64 msvc Release
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: arm64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # macOS, AppleClang: macos-latest is Apple Silicon and macos-15-intel is the
  # x64 runner.  Same suite, same Doxygen gate, two more libms.
  # -------------------------------------------------------------------------
  macos:
    name: macos ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: arm64
            doxygen_asset: doxygen-1.18.0-mac-arm.zip
          - runner: macos-15-intel
            label: x64
            doxygen_asset: doxygen-1.18.0-mac-intel.zip
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Doxygen 1.18.0 (pinned release)
        run: |
          curl -L -sS -o /tmp/doxygen.zip https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/${{ matrix.doxygen_asset }}
          unzip -q /tmp/doxygen.zip -d /tmp
          echo "$(dirname "$(find /tmp/doxygen-1.18.0 -name doxygen -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 3
      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure
      - name: Docs (zero-warning Doxygen gate)
        run: cmake --build build --target excgrid-docs

  # -------------------------------------------------------------------------
  # windows-latest: the codegen freshness gate, alone in its own job.
  #
  # WHY IT MOVED OUT OF THE BUILD LEG.  It needs neither a C++ compiler nor a
  # build - it re-derives all fifteen generated/*.cpp from xc_defs/*.ey through
  # the vendored Yacas and diffs them - and it is the slowest thing in this
  # file.  As a step inside the windows leg it made that leg's red mean
  # "something in the windows leg" and it serialized behind a build it does not
  # use.  It still runs on every push and every pull request; its name now says
  # which gate failed.
  #
  # WHY WINDOWS ONLY.  The vendored Yacas is the pinned 1.8.0-win64 binary
  # (tools/yacas/, YACAS_PROVENANCE.md) and a second vendored toolchain for a
  # linux leg was deliberately not taken.  So no linux freshness leg is shipped
  # here: it cannot work without that toolchain, and this file will not carry a
  # leg whose failure mode is "no yacas".  If Linux coverage for this gate is
  # wanted, the prerequisite is a pinned linux Yacas, not a CI leg.
  #
  # CLANG-FORMAT 22.1.3 IS PINNED, and that is a repair rather than a
  # preference.  The gate passes the regenerated text through clang-format and
  # compares bytes, so the committed kernels reproduce only under a formatter
  # that agrees with the one that produced them; until this pin the step used
  # whatever clang-format the runner image happened to ship - green today, and
  # decided by an image update nobody reviews.  Verified locally 2026-09-17:
  # all fifteen committed files are fixed points of 22.1.3, and two of them
  # (slater_exchange, pbe_exchange) were re-derived end to end through yacas +
  # 22.1.3 + the reachability prune and came back byte-identical.  The wheel
  # exists for win_amd64 (PyPI index, 2026-09-17).
  #
  # TIMEOUT 90 MINUTES, deliberately above the gate's own bound: the driver
  # kills a non-terminating expansion at 1800 s per kernel and names the
  # kernel, and the slowest HEALTHY kernel measured on this tree is
  # pbe_correlation at about 12.5 minutes.  A job timeout below that would kill
  # the job before the driver could say which kernel stalled, which is the one
  # message worth having.
  # -------------------------------------------------------------------------
  codegen-freshness:
    name: codegen-freshness (vendored Yacas 1.8.0, clang-format 22.1.3)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Python + clang-format 22.1.3 (the formatter the committed bytes reproduce under)
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --quiet clang-format==22.1.3
      - name: Codegen freshness (regenerate every kernel to a temp dir, then diff)
        run: |
          .\.venv\Scripts\python.exe tools/regenerate.py --check --clang-format .venv/Scripts/clang-format.exe
          git diff --exit-code -- generated/

  # -------------------------------------------------------------------------
  # The zero-warning Doxygen gate, as its own blocking leg on every push and
  # every pull request.
  #
  # WHY IT IS NOT docs.yml.  docs.yml publishes to GitHub Pages from a v-tag,
  # and a publisher is not a gate: on that trigger the API reference may rot
  # between releases.  This job runs the same target (excgrid-docs,
  # WARN_AS_ERROR YES, EXTRACT_ALL NO, Doxygen 1.18.0) on every change, so a
  # change that introduces a Doxygen warning is red.
  #
  # THE TWO ASSERTIONS ARE THE POINT, and each exists because its absence is a
  # green leg that proves nothing:
  #   * Doxygen must be FOUND at configure time.  find_package(Doxygen QUIET)
  #     leaves the excgrid-docs target undefined when it is not found, and the
  #     build then dies with "No rule to make target" - a confusing red for a
  #     missing tool, one step away from a target that silently does not exist.
  #     The cache is therefore tested for the NOTFOUND SENTINEL, not merely for
  #     the variable's presence: find_program caches the failure as
  #     `DOXYGEN_EXECUTABLE:FILEPATH=DOXYGEN_EXECUTABLE-NOTFOUND` (measured
  #     2026-09-17 on this tree with CMAKE_FIND_USE_SYSTEM_ENVIRONMENT_PATH=OFF
  #     and with Doxygen found: `...:FILEPATH=C:/Tools/doxygen.exe`), so a bare
  #     `grep '^DOXYGEN_EXECUTABLE'` matches in exactly the case this step
  #     exists to catch.
  #   * the PUBLISHED ARTIFACT must exist.  docs.yml uploads
  #     build/doxygen/html to Pages; if the Doxyfile's OUTPUT_DIRECTORY or
  #     HTML_OUTPUT ever moves, that upload publishes a site whose root has no
  #     index.html and no leg would notice - the defect docs.yml's own comment
  #     records fixing by hand.  This step turns it into a red leg.
  # -------------------------------------------------------------------------
  docs:
    name: docs (zero-warning Doxygen gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Doxygen 1.18.0 (pinned release)
        run: |
          curl -L -sS -o /tmp/doxygen.tar.gz https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          tar -xzf /tmp/doxygen.tar.gz -C /tmp
          echo "$(dirname "$(find /tmp/doxygen-1.18.0 -name doxygen -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Configure (tests off - this job's subject is the docs gate)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEXCGRID_BUILD_TESTS=OFF
      - name: Assert the gate is wired (Doxygen found at configure time)
        run: |
          if grep -q '^DOXYGEN_EXECUTABLE:FILEPATH=.*-NOTFOUND' build/CMakeCache.txt; then
            echo "Doxygen was not found at configure time (CMake cached DOXYGEN_EXECUTABLE as NOTFOUND), so the excgrid-docs target does not exist and this gate could not run."
            exit 1
          fi
          if ! grep -q '^DOXYGEN_EXECUTABLE:FILEPATH=' build/CMakeCache.txt; then
            echo "build/CMakeCache.txt carries no DOXYGEN_EXECUTABLE path, so the excgrid-docs target cannot be assumed to exist."
            exit 1
          fi
      - name: Docs (zero-warning Doxygen gate)
        run: cmake --build build --target excgrid-docs
      - name: Assert the artifact the Pages deploy uploads exists
        run: test -f build/doxygen/html/index.html
